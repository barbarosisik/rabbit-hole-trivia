name: Game checks
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser gameplay
        run: node tests/check-game.cjs
      - name: Windows three-question turns
        shell: powershell
        run: '& powershell.exe -NoProfile -STA -File "Rabbit Hole\RabbitHole.ps1" -SelfTest; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
